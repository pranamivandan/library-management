<!DOCTYPE html>
<html>
<head>
    <title>{{ book.title }}</title>
</head>
<body>

<h1>{{ book.title }}</h1>

{% if book.image %}
<img src="{{ book.image.url }}" alt="{{ book.title }}" style="max-width:250px; display:block; margin-bottom:15px;">
{% endif %}

<p><b>Author:</b> {{ book.author }}</p>

<p><b>Description:</b></p>

<p>{{ book.description }}</p>

{% if book.is_available %}
<p>Status: Available</p>
{% else %}
<p>Status: Issued</p>
{% endif %}

<a href="{% url 'studentdesk' %}">Back</a>

</body>
</html>
